name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-xinerama0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest typeguard

      - name: Verify Code Compilation
        run: |
          python -m compileall src main.py

      - name: Run Test Suite
        run: |
          xvfb-run -a python -m pytest \
            -vv \
            -s \
            --durations=20 \
            --durations-min=1 \
            tests/

  build:
    name: Build Packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            binutils

      - name: Build Debian Package
        run: |
          chmod +x packaging/debian/build_deb.sh
          ./packaging/debian/build_deb.sh

      - name: Build AppImage Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x packaging/appimage/build_appimage.sh
          ./packaging/appimage/build_appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartSort-Packages
          if-no-files-found: error
          retention-days: 30
          path: |
            build/deb/*.deb
            build/appimage/*.AppImage
