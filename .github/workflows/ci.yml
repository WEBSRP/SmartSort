name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1-mesa-dev libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest typeguard

      - name: Verify Code Compilation
        run: |
          python -m compileall src/ main.py

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/

  build:
    name: Build Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Build Debian Package
        run: |
          ./packaging/debian/build_deb.sh

      - name: Build AppImage Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./packaging/appimage/build_appimage.sh

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartSort-Packages
          path: |
            build/deb/*.deb
            build/appimage/*.AppImage
