app-id: com.smartsort.SmartSort
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: smartsort
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=~/Downloads
  - --filesystem=~
modules:
  - name: smartsort
    buildsystem: simple
    build-commands:
      - install -D -m 755 smartsort.sh /app/bin/smartsort
      - cp -r src config main.py assets /app/bin/
      - install -D -m 644 assets/icons/logo.png /app/share/icons/hicolor/scalable/apps/com.smartsort.SmartSort.png
      - install -D -m 644 com.smartsort.SmartSort.desktop /app/share/applications/com.smartsort.SmartSort.desktop
    sources:
      - type: dir
        path: ../../
