app-id: com.smartsort.SmartSort
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: smartsort
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: smartsort
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=packaging/flatpak/python-wheels --prefix=/app -r packaging/flatpak/requirements_flatpak.txt
      - install -D -m 755 packaging/flatpak/smartsort.sh /app/bin/smartsort
      - cp -r src config main.py assets /app/bin/
      - install -D -m 644 assets/icons/logo_square.png /app/share/icons/hicolor/scalable/apps/com.smartsort.SmartSort.png
      - install -D -m 644 packaging/flatpak/com.smartsort.SmartSort.desktop /app/share/applications/com.smartsort.SmartSort.desktop
    sources:
      - type: dir
        path: ../../
